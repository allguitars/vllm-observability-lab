process_settings:
    num_gpus: 1
    specify_gpus: "0"
    master_port: 8299
    multi_node_settings:
        enable: False
        master_addr: "0.0.0.0"

run_settings:
    task_type: "text-generation"
    task_mode: "train"
    per_device_train_batch_size: 1
    per_update_total_batch_size: 4
    num_train_epochs: 1000
    max_iter: -1
    max_seq_len: 2048
    triton: True
    weight_file_format: null
    from_config: False
    precision_mode: 1
    enable_save_optimizer_state: False

    model_saver:
        max_num_of_saved_model_on_epoch_end: -1
        enable_save_model_on_iteration: false
        max_num_of_saved_model_on_iteration: 2
        num_of_iteration_to_save_model: 4

    lr_scheduler:
        mode: -1
        learning_rate: 0.0000070000000000

    optimizer:
        beta1: 0.9
        beta2: 0.95
        eps: 0.00000001
        weight_decay: 0.01

    early_stop:
        enable: false
        min_delta: 0.1
        patience: 3
        verbose: false

    lora:
        enable_lora: false
        lora_rank: 8
        lora_alpha: 16
        lora_task_type: "CAUSAL_LM"
        lora_target_modules: 
