process_settings: # GPU 與分散式訓練設定。
  master_port: 8299 # PyTorch 分散式訓練程序的通訊連接埠。
  num_gpus: 1 # 本次訓練使用的 GPU 數量。
  specify_gpus: '0' # 使用的 container 內 GPU 索引；多張時以逗號分隔，例如 "3,2"。
  multi_node_settings: # 跨主機訓練設定。
    enable: false # 是否啟用多節點訓練。
    master_addr: '127.0.0.1' # rank 0 主節點的 IP 或主機名稱；單機可用 127.0.0.1。

run_settings: # 訓練任務與執行設定。
  task_type: 'text-generation' # 任務類型；應與模型及資料集類型相符。
  task_mode: 'train' # 使用預設訓練流程；也可填訓練 Python 程式的絕對路徑。
  per_device_train_batch_size: 1 # 每張 GPU 每次處理的 batch 大小。
  per_update_total_batch_size: 4 # 累積後更新權重的總 batch；必須是 num_gpus * per_device_train_batch_size 的整數倍。
  num_train_epochs: 1 # 完整資料集要訓練幾輪。
  max_iter: -1 # 每個 epoch 的 iteration 上限；-1 表示跑完所有 iteration。
  max_seq_len: 2048 # 訓練序列長度；需符合模型的 context-length 限制。
  triton: true # 啟用群聯整合的 Triton 訓練加速。
  weight_file_format: null # 權重格式；可為 safetensors、bin、pt、pth 或 null；null 時自動尋找。
  from_config: false # true 時隨機初始化權重；false 時載入預訓練權重。
  precision_mode: 1 # 0 為 BF16；1 為 BF16 與 FP32 混合精度。
  enable_save_optimizer_state: false # 是否保存 optimizer state，供下次訓練接續使用。

model_saver: # 模型 checkpoint 保存設定。
  max_num_of_saved_model_on_epoch_end: -1 # 每個 epoch 結束時最多保留的模型數；-1 等同 num_train_epochs。
  enable_save_model_on_iteration: false # 是否依 iteration 週期額外保存模型。
  max_num_of_saved_model_on_iteration: 2 # iteration checkpoint 最多保留份數；文件建議至少 2。
  num_of_iteration_to_save_model: 2 # 每隔幾個 iteration 保存一次；必須為 gradient_accumulation_steps 的整數倍。

lr_scheduler: # 學習率排程設定。
  mode: 1 # -1=LinearLR、0=LinearLR、1=CosineAnnealingLR、2=ExponentialLR、3=MultiplicativeLR、4=StepLR、5=MultiStepLR。
  learning_rate: 0.000007 # 學習率，會直接影響訓練結果。

optimizer: # Adam optimizer 超參數。
  beta1: 0.9 # Adam 的 beta1。
  beta2: 0.95 # Adam 的 beta2。
  eps: 0.00000001 # Adam 的 epsilon。
  weight_decay: 0.01 # 權重衰減係數。

early_stop: # 依驗證集 val_loss 提早停止的設定。
  enable: false # 是否啟用提早停止。
  min_delta: 0.01 # val_loss 相較最佳值至少改善此幅度才視為改善。
  patience: 2 # val_loss 未改善超過此次數時停止訓練。
  verbose: false # 是否輸出 loss 訊息。

lora: # LoRA 訓練設定。
  enable_lora: false # 是否啟用 LoRA。
  lora_rank: 8 # LoRA 低秩矩陣的維度。
  lora_alpha: 16 # LoRA 權重矩陣的縮放係數。
  lora_task_type: 'CAUSAL_LM' # LoRA 任務類型；本版文件列出的支援值為 CAUSAL_LM。
  lora_target_modules: null # 指定套用 adapter 的模組名稱；null 表示未指定。
