# 依 aiDAPTIVLink 2.0 文字生成 Env config 範例建立。
# 所有非空路徑均須為 Phison 訓練 container 內可存取的路徑；模型與儲存路徑應使用絕對路徑。
# 僅填寫本次訓練模式需要的欄位。
path_settings:
  lora:
    lora_weight: '' # 既有 LoRA adapter 權重目錄；僅在 exp config 啟用 LoRA 時使用。
    lora_optimizer: '' # 既有 LoRA optimizer state 路徑；僅在啟用 LoRA 並要續訓時使用。
    lora_output_dir: '' # LoRA adapter 輸出目錄；未指定時不會另存 LoRA 模型。
  model_name_or_path: '/app/gemma-3-12b-it' # 必填：預訓練模型權重目錄。
  multi_node_env_path: null # 多節點訓練的環境設定檔；單機訓練維持 null。
  optimizer_path: '' # 前次訓練保存的 optimizer state；指定後可接續其訓練狀態。
  train_data_path:
    # 填入一或多個資料集設定 YAML 的路徑，而非原始 JSON，例如：
    - /workspace/finetune/configs/dataset/qa_dataset_config.yaml
  val_data_path: null # 選填：驗證資料集設定 YAML；啟用 early stop 時應提供。
  nvme_path: '/mnt/nvme0' # 必填：aiDAPTIVCache 的掛載點，例如 /mnt/nvme0。
  output_dir: '/workspace/finetune/runs/gemma3-12b-smoke-001/trained-model' # 微調完成模型的輸出目錄；未指定時不會保存微調模型。
  log_name: '/workspace/finetune/runs/gemma3-12b-smoke-001/train.log' # 訓練日誌的名稱或儲存位置；未指定時使用工具的預設命名。
